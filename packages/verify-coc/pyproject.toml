[project]
name = "attesta-verify"
version = "0.1.0"
description = "Standalone offline zero-trust Chain-of-Custody bundle verifier for Attesta"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0.0",
    "cryptography>=44.0.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
attesta-verify = "verify_coc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verify_coc"]
